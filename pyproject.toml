[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rocket-propulsion-lab"
version = "0.9.0"
description = "Rocket propulsion analysis and propagation-ready propulsion models for astrodynamics."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary. All rights reserved." }
authors = [{ name = "Ayberk Demirkanat" }]
keywords = ["rocket", "propulsion", "nozzle", "compressible-flow", "thermodynamics", "astrodynamics", "orbit-propagation", "electric-propulsion"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: Other/Proprietary License",
    "Private :: Do Not Upload",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/ayberkdt/Rocket-Propulsion-Lab"
Repository = "https://github.com/ayberkdt/Rocket-Propulsion-Lab"
Issues = "https://github.com/ayberkdt/Rocket-Propulsion-Lab/issues"

[project.optional-dependencies]
cea = ["cea==3.3.4"]
dev = [
    "pytest>=8",
    "ruff==0.17.2",
    "mypy==2.1.0",
    "mpmath==1.3.0",
    "numpy==2.2.6",
    "scipy==1.14.1",
]

[project.scripts]
rocket-propulsion = "rocket_propulsion.api.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
rocket_propulsion = [
    "web/*.html", "web/*.css", "web/*.js", "web/*.mjs",
    "web/vendor/sunumatik/*", "web/vendor/sunumatik/typefaces/*",
    "thermochemistry/data/*.json",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
files = ["src/rocket_propulsion"]
warn_unused_ignores = true
warn_redundant_casts = true
strict_equality = true
no_implicit_optional = true
check_untyped_defs = true
show_error_codes = true

[[tool.mypy.overrides]]
# The optional NASA CEA provider ships without type information.
module = ["cea", "cea.*"]
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint.per-file-ignores]
# Byte-exact, hash-verified upstream patch candidate; its fallback is retained.
"scripts/native_lunaris_candidate/plans.py" = ["BLE001", "I001", "RUF022"]

